# Quality gate for pull requests, plus a nightly run (cron):
#  1. unit tests on a Python version matrix
#  2. coverage gate (fails below 85 %)
#  3. README marker validation (fails CI if markers are missing/broken)
#  4. preview matrix: dry-run README diff for each scope, shown in the Checks summary
name: README CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["README.md", "scripts/**", "tests/**", ".github/workflows/**"]
  schedule:
    - cron: "23 2 * * *"     # nightly: catches API or dependency drift with no new commits
  workflow_dispatch:

permissions:
  contents: read             # CI never writes; previews use the read-only GITHUB_TOKEN

concurrency:
  group: readme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet coverage==7.16.2
      - run: coverage run --source=scripts -m unittest discover -s tests
      - name: Coverage gate (85 %)
        run: |
          echo '### Test coverage' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=85

  validate-markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/update_readme.py --check

  preview:
    if: github.event_name != 'push'
    needs: [validate-markers]
    name: preview (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: this-repo
            repos: ${{ github.repository }}
          - scope: aggregated
            repos: ${{ vars.ACTIVITY_REPOS || github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry-run README update
        env:
          GITHUB_TOKEN: ${{ github.token }}   # no secrets needed; also safe for fork PRs
          ACTIVITY_REPOS: ${{ matrix.repos }}
          ACTIVITY_USER: ${{ vars.ACTIVITY_USER }}
        run: python3 scripts/update_readme.py --dry-run
