# Updates the "Recent Activities" section of README.md and the coverage badge.
# Triggers: manual (workflow_dispatch) + every 6 hours (schedule).
# Deliberately NOT triggered on push, so the bot's own commit can never loop.
name: Update README Activity

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Number of activity lines"
        default: "10"
  schedule:
    - cron: "17 */6 * * *"   # off the hour to avoid the :00 rush (UTC)

permissions:
  contents: write            # the only permission this job needs

concurrency:
  group: update-readme       # never two writers at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned for reproducibility
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 50          # enough history to recognise the bot's own commits

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate markers
        run: python scripts/update_readme.py --check

      - name: List the bot's own commits  # hidden from the activity list (no self-feeding loop)
        run: git log -n 50 --author='github-actions\[bot\]' --format=%H > "$RUNNER_TEMP/bot-shas.txt"

      - name: Render activity            # ETag cache lives in .cache/activity.json (committed)
        id: render
        env:
          IGNORE_SHAS_FILE: ${{ runner.temp }}/bot-shas.txt
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          ACTIVITY_REPOS: ${{ vars.ACTIVITY_REPOS || github.repository }}
          ACTIVITY_REPO_LIMIT: ${{ vars.ACTIVITY_REPO_LIMIT || '5' }}
          ACTIVITY_USER: ${{ vars.ACTIVITY_USER }}
          MAX_ITEMS: ${{ inputs.max_items || '10' }}
          RATE_LIMIT_MAX_RETRIES: ${{ vars.RATE_LIMIT_MAX_RETRIES || '4' }}
          RATE_LIMIT_MAX_WAIT: ${{ vars.RATE_LIMIT_MAX_WAIT || '60' }}
          RATE_LIMIT_FLOOR: ${{ vars.RATE_LIMIT_FLOOR || '50' }}
        run: python scripts/update_readme.py

      - name: Refresh coverage badge
        run: |
          pip install --quiet coverage==7.16.2
          coverage run --source=scripts -m unittest discover -s tests
          coverage json -o coverage.json
          python scripts/coverage_badge.py coverage.json badges/coverage.json

      - name: Commit if anything changed
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          # the cache is only committed together with a README change,
          # so a run with nothing new produces no commit (idempotent)
          if [ "$CHANGED" = "true" ]; then git add README.md .cache/activity.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit (idempotent run)"
          else
            git commit -m "chore(readme): update recent activity"
            git push
          fi
